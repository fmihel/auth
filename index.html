<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>test</title>
    <style>
        body {
            padding: 2rem;
            font-family: Arial, sans-serif;
            background-color: black;
            color: lime;
        }

        .group {}

        input {
            display: block;
        }

        body.loading>.loading {
            display: block;
        }

        body.loading>.not-autorized {
            display: none;
        }

        body.loading>.autorized {
            display: none;
        }

        body.autorized>.loading {
            display: none;
        }

        body.autorized>.not-autorized {
            display: none;
        }

        body.autorized>.autorized {
            display: block;
        }

        body.not-autorized>.loading {
            display: none;
        }

        body.not-autorized>.not-autorized {
            display: block;
        }

        body.not-autorized>.autorized {
            display: none;
        }
    </style>
</head>

<script src="./js/Request.js"></script>
<script src="./js/Session.js"></script>
<script src="./utils.js"></script>

<body class="loading">

    <div class="loading">
        loading...
    </div>

    <div class="not-autorized">
        <div id="autorize" class="group">
            <input id="login" value="1" />
            <input id="pass" value="1" />
            <input type="button" value="autorize" onclick="autorizeByLogin()" />
        </div>
    </div>

    <div class="autorized">
        <input id="sending_data" value="aaaa" />
        <input type="button" value="send" onclick="send()" />

        <hr />
        <input type="button" value="logout" onclick="logout()" />

    </div>

    <script>

        const request = new Request();
        const session = new Session(request);

        const body = DOM('body');
        const login_group = DOM('.group.autorize');
        const login = DOM('#login');
        const pass = DOM('#pass');
        const sending_data = DOM('#sending_data');

        session.on('autorize', () => {
            console.log('autorized');
            DOM_CLASS.replace(body, 'autorized');
        });

        session.on('logout', () => {
            console.log('logout');
            DOM_CLASS.replace(body, 'not-autorized');
        });

        session.autorizeByToken()
            .catch(e => {
                DOM_CLASS.replace(body, 'not-autorized');
            })


        function autorizeByLogin() {
            session.autorizeByLogin(login.value, pass.value);
        }

        function logout() {
            session.logout();
        }

        function send() {
            console.log(sending_data.value);
            request.post({
                to:'ajax/test',
                data:{ value: sending_data.value }
            })
            .then((o)=>{
                console.log(o);
            })
            .catch(e=>{
                console.error(e);
            })

        }
    </script>
</body>

</html>
